<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexus Core Switch Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    [role="switch"] { width: 2.75rem; height: 1.5rem; border-radius: 9999px; position: relative; transition: background .2s; }
    [role="switch"]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 1.25rem; height: 1.25rem; border-radius: 9999px; background: #fff; transition: transform .2s; }
    [role="switch"][aria-checked="true"]::after { transform: translateX(1.25rem); }
    [role="switch"][disabled] { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
